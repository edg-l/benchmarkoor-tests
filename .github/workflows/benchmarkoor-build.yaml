name: benchmarkoor-build

on:
  workflow_dispatch:
    inputs:
      clients:
        description: "JSON array of execution clients to benchmark"
        required: false
        default: '["nethermind"]'
      instance-id:
        description: "Set this if you have multiple configurations for the same client but just want to run one of them"
        required: false
        default: ""
      snapshot:
        description: "Snapshot path "
        required: false
        type: choice
        options:
          - "state-actor/v1"
      context:
        description: "Test context"
        required: false
        type: choice
        options:
          - "repricing"
        default: "repricing"
      subdir:
        description: "Subdirectory"
        required: true
        type: choice
        options:
          - "v1/bal-devnet-7"
      test-type:
        description: "Test type to run"
        required: false
        type: choice
        options:
          - "stateful"
          - "compute"
        default: "stateful"

      build-timeout-minutes:
        description: "Timeout for the benchmark build (minutes)"
        required: false
        default: "240"
      image:
        description: "Benchmarkoor docker image"
        required: false
        default: "ghcr.io/ethpandaops/benchmarkoor:master"
      git-ref:
        description: "Git reference to checkout for benchmarkoor"
        required: false
        default: ""
      build-config:
        description: 'Raw YAML config content to pass via --config (appended after URL config)'
        required: false
        default: ''

jobs:
  benchmarkoor:
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(inputs.clients) }}
    runs-on:
      group: gasbenchmark
      labels:
        - benchmarkoor-builder-${{ matrix.client }}
    timeout-minutes: ${{ fromJSON(inputs.build-timeout-minutes) }}
    steps:
      - name: "Infos: Client=${{ matrix.client }} | Snapshot=${{ inputs.snapshot }} | TestType=${{ inputs.test-type }} | Context=${{ inputs.context }} | Subdirectory=${{ inputs.subdir }}"
        run: |
          echo "client: ${{ matrix.client }}"
          echo "snapshot: ${{ inputs.snapshot }}"
          echo "test-type: ${{ inputs.test-type }}"
          echo "subdir: ${{ inputs.subdir }}"
          echo "build-timeout-minutes: ${{ inputs.build-timeout-minutes }}"
          echo "image: ${{ inputs.image }}"
          echo "git-ref: ${{ inputs.git-ref }}"

      - uses: actions/checkout@v4

      - name: Calculate builder run timeout
        id: calc
        run: |
          echo "builder_timeout=$(( ${{ inputs.build-timeout-minutes }} - 30 ))m" >> "$GITHUB_OUTPUT"

      - uses: ethpandaops/benchmarkoor@master
        env:
          BENCHMARKOOR_BUILDER_RUN_TIMEOUT: ${{ steps.calc.outputs.builder_timeout }}
        with:
          mode: build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ inputs.image }}
          git-ref: ${{ inputs.git-ref }}
          upload-artifacts: "false"
          build-config-urls: >-
            https://raw.githubusercontent.com/ethpandaops/benchmarkoor-tests/master/configs/global.yaml,
            https://raw.githubusercontent.com/ethpandaops/benchmarkoor-tests/master/configs/datadirs/${{ inputs.snapshot }}/global.yaml,
            https://raw.githubusercontent.com/ethpandaops/benchmarkoor-tests/master/configs/datadirs/${{ inputs.snapshot }}/runner.yaml,
            https://raw.githubusercontent.com/ethpandaops/benchmarkoor-tests/master/configs/contexts/${{ inputs.context }}/${{ inputs.subdir }}/global.yaml
            https://raw.githubusercontent.com/ethpandaops/benchmarkoor-tests/master/configs/contexts/${{ inputs.context }}/${{ inputs.subdir }}/test-source.${{ inputs.test-type }}.builder.yaml,
          build-args: >-
            --rebuild-on-diff
          build-config: ${{ inputs.build-config }}
